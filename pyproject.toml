[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "kaos-source"
dynamic = ["version"]
description = "KAOS-native source discovery and materialization — filesystem, archive, HTTP, browser, plus REST connectors for Federal Register / eCFR / EDGAR / GovInfo / GLEIF and forensic parsers for VCard / EML / MBOX / PACER / EXIF"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "273 Ventures LLC", email = "it@273ventures.com" },
]
maintainers = [
  { name = "Michael Bommarito", email = "mike@273ventures.com" },
]
keywords = [
  "agentic",
  "edgar",
  "ediscovery",
  "federal-register",
  "kaos",
  "legal-tech",
  "mcp",
  "model-context-protocol",
  "source-discovery",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Internet :: WWW/HTTP",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.28.1",
  # kaos_core.ArtifactStore.create_from_bytes + ArtifactManifest.source_uri
  # + KaosCoreArtifactSettings debut in 0.1.0a8. Required by Stage B2 of the
  # no-hardcoded-caps-and-artifact-first-tool-results plan (FR/eCFR get-content
  # tools migrated off max_chars truncation to artifact materialization).
  "kaos-core>=0.1.0a8,<0.2",
  "pydantic>=2.11.0",
]

[dependency-groups]
dev = [
  # kaos-content 0.1.0a2 carries the KCONT-01 XXE fix the platform-wide
  # parser audit produced; pin the floor so dev installs receive it.
  "kaos-content[html]>=0.1.0a2",
  # PEP 440: ``>=0.1.0`` excludes pre-releases; only alphas on PyPI
  # today. Re-floor at the GA tag once kaos-nlp-core ships a non-alpha.
  "kaos-nlp-core>=0.1.0a2",
  # Note: kaos-mcp is intentionally absent from dev at v0.1.0a1.
  # kaos-mcp ships in Wave 3 and is not on PyPI yet; including it
  # here would block ``uv sync`` per F009 lesson #4. Re-add at
  # 0.1.0a2 alongside the [mcp] extra.
  "lxml>=5.0.0",
  "pillow>=12.2.0",
  "pytest>=8.3.5",
  "pytest-asyncio>=0.26.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.11.0",
  "ty>=0.0.1a17",
]

[project.scripts]
kaos-source = "kaos_source.cli:main"
kaos-source-serve = "kaos_source.serve:main"

[project.optional-dependencies]
browser = [
  "playwright>=1.52.0",
]
content = [
  # KCONT-01 (XXE guard) ships in kaos-content 0.1.0a2; pin the floor
  # so installations of the [content] extra get the safer parser.
  "kaos-content[html]>=0.1.0a2",
  # PEP 440: ``>=0.1.0`` excludes pre-releases. Only alphas of
  # kaos-nlp-core are on PyPI today (0.1.0a2 latest); the alpha-aware
  # floor opts the resolver in without requiring ``--pre``.
  "kaos-nlp-core>=0.1.0a2",
]
pacer = [
  "lxml>=5.0.0",
]
# Note: the [mcp] extra (pinning kaos-mcp>=0.1.0) is intentionally
# absent at v0.1.0a1. kaos-mcp ships in Wave 3; ``uv lock`` is strict
# and refuses to resolve any declared extra whose sibling isn't on
# PyPI yet (per docs/oss/ F009 lesson #4). Re-add this extra in
# 0.1.0a2 once kaos-mcp is on PyPI.

[project.urls]
Homepage = "https://kelvin.legal"
Documentation = "https://docs.kelvin.legal"
Repository = "https://github.com/273v/kaos-source"
Issues = "https://github.com/273v/kaos-source/issues"
Changelog = "https://github.com/273v/kaos-source/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "kaos_source/_version.py"

[tool.hatch.build.targets.sdist]
include = [
  "/kaos_source",
  "/README.md",
  "/LICENSE",
  "/NOTICE",
  "/CHANGELOG.md",
  "/CLAUDE.md",
  "/tests",
]

[tool.hatch.build.targets.wheel]
packages = ["kaos_source"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--cov=kaos_source",
  "--cov-branch",
  "--cov-report=term-missing",
]
markers = [
  "integration: end-to-end behavior checks",
  "unit: focused unit checks",
]

[tool.coverage.run]
source = ["kaos_source"]
branch = true
omit = [
  "*/tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "@abstractmethod",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "C4", "PTH"]

[tool.ruff.lint.isort]
known-first-party = ["kaos_source"]

[tool.ty.src]
include = ["kaos_source", "tests"]

[tool.uv]
package = true
exclude-newer = "72 hours"
[tool.uv.exclude-newer-package]
"kaos-citations" = false
"kaos-content" = false
"kaos-core" = false
"kaos-graph" = false
"kaos-llm-client" = false
"kaos-llm-core" = false
"kaos-mcp" = false
"kaos-ml-core" = false
"kaos-names" = false
"kaos-nlp-core" = false
"kaos-nlp-transformers" = false
"kaos-office" = false
"kaos-pdf" = false
"kaos-source" = false
"kaos-tabular" = false
"kaos-web" = false
