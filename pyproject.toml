[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "kaos-source"
dynamic = ["version"]
description = "KAOS-native source discovery and materialization — filesystem, archive, HTTP, browser, plus REST connectors for Federal Register / eCFR / EDGAR / GovInfo / GLEIF and forensic parsers for VCard / EML / MBOX / PACER / EXIF"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "273 Ventures LLC", email = "it@273ventures.com" },
]
maintainers = [
  { name = "Michael Bommarito", email = "mike@273ventures.com" },
]
keywords = [
  "agentic",
  "edgar",
  "ediscovery",
  "federal-register",
  "kaos",
  "legal-tech",
  "mcp",
  "model-context-protocol",
  "source-discovery",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Internet :: WWW/HTTP",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.28.1",
  # kaos_core.path_resolver.resolve_input_path debuts in 0.1.0a9. Required
  # by Stage 4 of the vfs-blind-tools-audit-and-fix plan: every file-input
  # MCP tool routes agent-supplied paths through the helper so VFS uploads
  # from a host UI become visible.
  "kaos-core>=0.1.0,<0.2",
  "pydantic>=2.11.0",
]

[dependency-groups]
dev = [
  # kaos-content 0.1.0a2 carries the KCONT-01 XXE fix the platform-wide
  # parser audit produced; pin the floor so dev installs receive it.
  "kaos-content[html]>=0.1.0a2",
  # WU-J: bump pin floor to 0.1.0rc1 across kaos-* deps. Re-floor at
  # the GA tag once kaos-nlp-core ships a non-prerelease.
  "kaos-nlp-core>=0.1.0,<0.2",
  # Note: kaos-mcp is intentionally absent from dev at v0.1.0a1.
  # kaos-mcp ships in Wave 3 and is not on PyPI yet; including it
  # here would block ``uv sync`` per F009 lesson #4. Re-add at
  # 0.1.0a2 alongside the [mcp] extra.
  "lxml>=5.0.0",
  "pillow>=12.2.0",
  "pytest>=8.3.5",
  "pytest-asyncio>=0.26.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.11.0",
  "ty>=0.0.1a17",
]

[project.scripts]
kaos-source = "kaos_source.cli:main"
kaos-source-serve = "kaos_source.serve:main"

[project.optional-dependencies]
browser = [
  "playwright>=1.52.0",
]
content = [
  # KCONT-01 (XXE guard) ships in kaos-content 0.1.0a2; pin the floor
  # so installations of the [content] extra get the safer parser.
  "kaos-content[html]>=0.1.0a2",
  # WU-J: bump pin floor to 0.1.0rc1 across kaos-* deps.
  "kaos-nlp-core>=0.1.0,<0.2",
]
pacer = [
  "lxml>=5.0.0",
]
# MCP server — required by the `kaos-source-serve` console script
# (see `kaos_source.serve`). Install with
# `pip install kaos-source[mcp]` to run the source MCP server.
mcp = [
  "kaos-mcp>=0.1.0,<0.2",
]

[project.urls]
Homepage = "https://kelvin.legal"
Documentation = "https://docs.kelvin.legal"
Repository = "https://github.com/273v/kaos-source"
Issues = "https://github.com/273v/kaos-source/issues"
Changelog = "https://github.com/273v/kaos-source/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "kaos_source/_version.py"

[tool.hatch.build.targets.sdist]
include = [
  "/kaos_source",
  "/README.md",
  "/LICENSE",
  "/NOTICE",
  "/CHANGELOG.md",
  "/CLAUDE.md",
  "/tests",
]

[tool.hatch.build.targets.wheel]
packages = ["kaos_source"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--cov=kaos_source",
  "--cov-branch",
  "--cov-report=term-missing",
  "-m",
  "not live and not requires_browser",
]
markers = [
  "integration: end-to-end behavior checks",
  "unit: focused unit checks",
  "live: tests that hit the real public internet (deselected by default)",
  "requires_browser: tests that require the [browser] extra + Playwright runtime",
]

[tool.coverage.run]
source = ["kaos_source"]
branch = true
omit = [
  "*/tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "@abstractmethod",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "C4", "PTH"]

[tool.ruff.lint.isort]
known-first-party = ["kaos_source"]

[tool.ty.src]
include = ["kaos_source", "tests"]

[tool.uv]
package = true
exclude-newer = "72 hours"

[tool.uv.exclude-newer-package]
"kaos-citations" = false
"kaos-content" = false
"kaos-core" = false
"kaos-graph" = false
"kaos-llm-client" = false
"kaos-llm-core" = false
"kaos-mcp" = false
"kaos-ml-core" = false
"kaos-names" = false
"kaos-nlp-core" = false
"kaos-nlp-transformers" = false
"kaos-office" = false
"kaos-pdf" = false
"kaos-source" = false
"kaos-tabular" = false
"kaos-web" = false
# 2026-05-22 — uploaded within the 72h quarantine but required to
# close CVE-2026-45409 surfaced by the working pip-audit (uvx swap,
# kaos-agents 50fdc9b). Pre-fix pip-audit returned false-green.
"idna" = false      # CVE-2026-45409 (fixed in 3.15)
