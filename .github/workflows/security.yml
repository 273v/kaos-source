name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly Monday 02:00 UTC — re-scan in case a new CVE landed against
    # an existing pinned dependency.
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ────────────── gitleaks (CLI, license-free) ──────────────
  # `gitleaks/gitleaks-action@v2` requires a paid license for
  # organization-owned repositories as of late 2025. The gitleaks CLI
  # itself is MIT-licensed and free; we run it directly via the
  # official Docker image so there is no license, no rate limit, and
  # no third-party action in our supply chain for this scan.
  #
  # Rule scope: the default open-source ruleset, plus any project-local
  # overrides in `.gitleaks.toml` and `.gitleaksignore`.
  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run gitleaks (Docker, no license required)
        # F7: pin to a versioned tag rather than ``:latest``. Dependabot
        # (.github/dependabot.yml github-actions ecosystem) tracks
        # version drift and opens a PR when a newer release lands; the
        # next hardening pass will replace this with an
        # ``image@sha256:...`` digest.
        env:
          GITLEAKS_VERSION: v8.21.2
        run: |
          docker run --rm -v "${GITHUB_WORKSPACE}:/repo" -w /repo \
            zricethezav/gitleaks:${GITLEAKS_VERSION} detect \
            --source /repo \
            --redact \
            --no-banner \
            --verbose \
            --exit-code 1

  # ────────────── pip-audit ──────────────
  # Scan the locked dependency set for known CVEs. PyPA-maintained
  # tooling that consults the Python Packaging Advisory Database (PyPA)
  # plus OSV.
  pip-audit:
    name: pip-audit (dependency CVEs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      # The pip-audit action creates its own subprocess venv that uses
      # whatever Python is on PATH. Several kaos-source runtime / dev
      # dependencies (kaos-core / kaos-content / kaos-nlp-core) declare
      # ``requires-python >=3.13``. Without 3.13 on the runner pip would
      # report "no matching distribution" on the alpha versions and
      # fail the audit before scanning. ``setup-python`` puts 3.13 on
      # PATH for everyone downstream.
      - name: Set up Python 3.13 (for pip-audit subprocess venv)
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Sync dependencies
        run: uv sync --group dev --python 3.13

      - name: Export installed dependency set to requirements.txt
        # pip-audit reads requirements.txt; uv export gives us the
        # exact resolved set, including transitive dependencies.
        run: uv export --no-hashes --no-emit-project --format requirements-txt > /tmp/requirements.txt

      - name: Run pip-audit
        # `--strict` makes the action fail on any vulnerability, even
        # warnings. We can switch to `--no-strict` and rely on the
        # GitHub annotation for advisory mode if this turns out to be
        # too noisy in practice.
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: /tmp/requirements.txt

  # ────────────── bandit (static code-level security scan) ──────────────
  # F7: catches obvious AST-level antipatterns (yaml.load, eval, hashlib MD5,
  # subprocess shell=True, etc.) that aren't dependency CVEs. Low severity
  # only at high confidence to keep the gate signal-rich.
  bandit:
    name: bandit (static security)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: security-bandit-py3.13

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Run bandit
        run: |
          uvx --python 3.13 bandit \
            --recursive \
            --skip B101,B404,B603,B607 \
            --severity-level medium \
            --confidence-level medium \
            kaos_source

  # ────────────── integration tests (scheduled / dispatch only) ──────────────
  # F7: integration tests aren't on the default unit gate but should run
  # at least nightly so cross-package regressions surface against main.
  integration:
    name: integration tests
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # Integration tests spin up local HTTP/MCP servers on 127.0.0.1.
    # kaos-core 0.1.0a5's KaosSecuritySettings defaults to
    # block_loopback=True (strict-by-default SSRF), which rejects the
    # tests' own localhost target with SourcePolicyError and cascades
    # to ConnectError + BrokenPipeError on the MCP-over-stdio tests.
    # Disable loopback blocking for this scheduled job only.
    env:
      KAOS_SECURITY_BLOCK_LOOPBACK: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: security-integration-py3.13

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Sync dependencies
        run: uv sync --group dev --python 3.13

      - name: Run integration tests
        run: uv run pytest tests/integration/ -q --no-cov

  # ────────────── vulture (dead-code detection) ──────────────
  # Reports names vulture is 100% confident are unreachable. The
  # `--ignore-names` list carves out names vulture can't infer from
  # the import graph (framework callbacks, signal handlers, OAuth /
  # OIDC field names accessed by string, MCP `_meta` keys, etc.).
  # Mirrors the pre-commit hook.
  vulture:
    name: vulture (dead-code scan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Run vulture
        run: |
          uvx --python 3.13 vulture \
            kaos_source \
            --min-confidence 100 \
            --ignore-names client_id,scopes,authorization_endpoint,token_endpoint,device_authorization_endpoint,url,open_ch,container_tag,message_id,parent_message_id,kwargs,context_id,frame,signum,exc_type,tb
