[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "kaos-source"
dynamic = ["version"]
description = "KAOS-native source discovery and materialization layer"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "LicenseRef-Proprietary" }
authors = [
  { name = "273 Ventures LLC", email = "it@273ventures.com" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.28.1",
  "kaos-core>=0.1.0",
  "pydantic>=2.11.0",
]

[dependency-groups]
dev = [
  "kaos-content[html]>=0.1.0",
  "kaos-mcp>=0.1.0",
  "kaos-nlp-core>=0.1.0",
  "lxml>=5.0.0",
  "pillow>=12.2.0",
  "pytest>=8.3.5",
  "pytest-asyncio>=0.26.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.11.0",
  "ty>=0.0.1a17",
]

[project.scripts]
kaos-source = "kaos_source.cli:main"
kaos-source-serve = "kaos_source.serve:main"

[project.optional-dependencies]
browser = [
  "playwright>=1.52.0",
]
content = [
  "kaos-content[html]>=0.1.0",
  "kaos-nlp-core>=0.1.0",
]
mcp = [
  "kaos-mcp>=0.1.0",
]
pacer = [
  "lxml>=5.0.0",
]

[project.urls]
Homepage = "https://273ventures.com"
Documentation = "https://docs.273ventures.com"
Repository = "https://github.com/273v/kaos-modules"

[tool.hatch.version]
path = "kaos_source/_version.py"

[tool.hatch.build.targets.sdist]
include = [
  "/kaos_source",
  "/README.md",
  "/CLAUDE.md",
  "/docs",
  "/tests",
]

[tool.hatch.build.targets.wheel]
packages = ["kaos_source"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--cov=kaos_source",
  "--cov-branch",
  "--cov-report=term-missing",
]
markers = [
  "integration: end-to-end behavior checks",
  "unit: focused unit checks",
]

[tool.coverage.run]
source = ["kaos_source"]
branch = true
omit = [
  "*/tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "@abstractmethod",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "C4", "PTH"]

[tool.ruff.lint.isort]
known-first-party = ["kaos_source"]

[tool.ty.src]
include = ["kaos_source", "tests"]

[tool.uv]
package = true

[tool.uv.sources]
kaos-content = { path = "../kaos-content", editable = true }
kaos-core = { path = "../kaos-core", editable = true }
kaos-mcp = { path = "../kaos-mcp", editable = true }
kaos-nlp-core = { path = "../kaos-nlp-core", editable = true }
